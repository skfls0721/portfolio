          어렸을 때부터 아버지를 따라다니며 자연스럽게 수영에 대한 흥미를 갖게 되었습니다. 물 속에서는 모든 소리가 먹먹하게 들리는데 물속에서 몸을 움직이는 데 집중하다 보면 복잡한 생각을 잠시 내려놓고 운동에 몰입할 수 있습니다.

          **나만의 수영 노하우 🌊**

          - 근처 수영장에서 강습을 받으며 다양한 수영 방법을 배우는 것을 추천드립니다. 다양한 수영 방법을 익히며 재미를 느끼게 될 수 있습니다!
