  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/profile.jpg"
    content: |-
      안녕하세요, 전북대학교 컴퓨터인공지능학부 3학년 홍나린입니다.

      프론트엔드와 백엔드를 함께 공부하며, 배운 것을 직접 만들어 보면서 내 것으로 만드는 방식을 좋아합니다.

      **관심 분야: Spring**
      수업에서 Spring Boot로 서버를 만들어 보면서 요청이 처리되는 구조와 인증·권한 같은 서버 로직에 관심을 갖게 되었습니다.

      **학습 목표**
      인프런 김영한 강사님의 Spring 강의를 들으며 Spring의 핵심 원리를 이해하는 것입니다. 현재 수강 중입니다.

      **다음 행동**
      강의를 들은 뒤 코드를 이해하려고 노력하고, 내 것으로 만들기 위해 강의 코드를 직접 다시 작성해 봅니다.
    skills:
      enable: true
      title: "배우고 프로젝트에 활용한 기술"
      items:
        - "Vue"
        - "Java"
        - "Spring Boot"
        - "JavaScript"

