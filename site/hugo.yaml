  # projects
  projects:
    enable: true
    items:
      - title: "한입 리뷰"
        content: |-
          맛집 후기 게시판 (2026년 10월, 완료·제출)

          목적: 로그인한 사용자만 글을 쓰고, 작성자만 수정·삭제할 수 있는 JWT 인증 게시판을 구현했습니다.

          역할: 웹서비스설계 수업의 개인 과제로, 제공된 시작 코드에서 JWT 발급·검증, 작성자 권한 검사, Vue 화면의 로그인 연결과 오류 처리를 혼자 구현하고 시험과 보고서까지 작성했습니다. AI 도구(Codex, Claude)의 도움을 받았고, 시험은 직접 실행해 확인했습니다.

          과정: 제공 코드 실행으로 구조 확인 → JWT 발급·검증 → 작성자 권한 검사 → Vue 로그인·토큰 전송·오류 처리 연결 → curl과 브라우저로 시험 → 보고서 작성과 GitHub 제출

          선택 이유: Vue와 Spring Boot는 앞선 수업에서 써 본 경험이 있어 선택했습니다. 작성자는 요청 본문이 아니라 토큰으로 확인한 사용자 번호로 서버가 정하게 했습니다. 본문의 authorId를 믿으면 다른 사람 이름으로 글을 쓸 수 있기 때문입니다.

          결과: 시험 17개 항목을 모두 직접 확인했고, 자동 검사 40개도 통과했습니다.

          배운 점: 401(누구인지 모름)과 403(누구인지는 알지만 권한 없음)의 차이, 버튼을 숨겨도 서버에서 다시 검사해야 한다는 점, AI가 준 코드는 적용 직후 빌드와 시험으로 확인해야 한다는 점을 배웠습니다.

          한계와 개선: 로그인 후 입력 폼이 초기화되지 않는 점, 서버가 꺼졌을 때의 안내가 불명확한 점을 개선할 계획입니다.
        image: /images/project-hanip-review.jpg
        badges:
          - "Vue"
          - "Spring Boot"
          - "JWT"
        links:
          - icon: fab fa-github
            url: "https://github.com/skfls0721/jwt-board-hanip-review"

