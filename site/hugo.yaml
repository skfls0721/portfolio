  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/profile.jpg"
    content: |-
      안녕하세요, 전북대학교 컴퓨터인공지능학부 3학년 홍나린입니다.

      프론트엔드와 백엔드를 함께 공부하며, 새롭게 배운 기술을 직접 구현하고 실습하면서 제 것으로 만들어 가는 과정을 좋아합니다.

      **Interest | 관심 분야**

      Spring 수업에서 Spring Boot를 활용해 서버를 구현하면서, 클라이언트의 요청이 처리되는 과정과 인증·권한 등 서버 로직의 동작 원리에 관심을 갖게 되었습니다.

      **Learning Goal | 학습 목표**

      현재 인프런 김영한 강사님의 Spring 강의를 수강하며 Spring의 핵심 원리와 동작 방식을 이해하는 데 집중하고 있습니다.

      **My Approach | 나만의 학습 방식**

      강의 내용을 단순히 따라 하는 데 그치지 않고, 코드를 직접 다시 작성하며 각 코드의 역할과 동작 원리를 이해하려고 노력합니다. 배운 내용을 스스로 설명하고 활용할 수 있을 때까지 반복해서 실습하는 것을 목표로 합니다.
    skills:
      enable: true
      title: "Tech Stack | 학습하고 프로젝트에 활용한 기술"
      items:
