          여유 시간이 생기면 애니메이션을 감상하며 휴식을 취합니다. 다양한 작품을 보면서 각기 다른 이야기와 캐릭터를 보는 것이 즐겁고, 일상에서 벗어나 새로운 세계를 경험할 수 있다는 점이 애니메이션의 매력이라고 생각합니다.

          **나만의 애니메이션 감상법 🍿**

